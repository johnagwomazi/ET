services:
  - type: web
    name: events-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: COOKIE_HTTP_ONLY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_MODE
        value: test
      - key: PAYSTACK_TIMEOUT_MS
        value: "10000"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: AUTH_RATE_LIMIT_MAX
        value: "10"
      - key: PAYMENT_MUTATION_RATE_LIMIT_MAX
        value: "10"
      - key: FINANCE_MUTATION_RATE_LIMIT_MAX
        value: "20"
      - key: EVENT_OPERATIONS_RATE_LIMIT_MAX
        value: "600"
      - key: NOTIFICATION_WORKER_ENABLED
        value: "true"
  - type: web
    name: events-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: off
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_APP_NAME
        value: Events
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
